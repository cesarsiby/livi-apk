name: LIVI backend CI

# V-AUDIT (section 40): this file used to live at
# backend/livi/.github/workflows/ci.yml. GitHub Actions only discovers
# workflows under .github/workflows/ at the REPOSITORY ROOT — a nested
# .github anywhere else is invisible to it. Confirmed, not assumed: this
# repo's *actual* root-level .github/workflows/ only ever contained
# supabase-migrations.yml, so every job below (unit tests, static audits,
# the full real-Postgres suite) had never once actually run in GitHub
# Actions, on any push or PR, despite this file's own comments describing
# it as already in place. Moved here unchanged apart from adding
# `defaults.run.working-directory: backend/livi` to both jobs below (GitHub
# Actions runs steps from the repo root by default; this file's `npm`/`find`
# commands assume backend/livi as the working directory, matching the same
# pattern already used in supabase-migrations.yml).
#
# V44 — CI/CD preparation. Before this file, there was no CI pipeline at
# all (verified: no .github/workflows/, no other CI config anywhere in the
# repo). Every version from V20 onward relied entirely on someone manually
# running `npm test` / `npm run test:postgres` and reading the output —
# nothing enforced that on every change. This workflow is the missing
# piece: it runs the unit/static suite (fast, no live database connection)
# on every push and pull request, and the full real-PostgreSQL suite
# (migrations plus every V35-V43 script) against a disposable Postgres
# service so the concurrency, reconciliation, and restore-drill scripts
# this project has been accumulating actually get exercised automatically
# instead of depending on someone remembering to run them by hand.

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  unit-tests:
    name: Unit & static tests (no database)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/livi
    env:
      # V44 fix (found while verifying this workflow, not just reading it):
      # src/config/env.js requires DATABASE_URL, JWT_ACCESS_SECRET, and
      # JWT_REFRESH_SECRET unconditionally (no defaults, validated via
      # Zod at import time) — regardless of NODE_ENV. This job never
      # connects to a database (new Pool(...) in src/config/db.js is lazy
      # and only connects on first query, which none of these tests
      # trigger), but any test file that transitively imports env.js
      # (11 of them do, e.g. tests/integration/ledger-finance.integration.test.js,
      # which only tests the pure functions commissionAmount()/
      # calculateWithdrawalFee() and needs no database at all) would
      # otherwise crash immediately on Zod's schema.parse(process.env)
      # before running a single assertion — not because of a missing `pg`
      # package (this job's dependency install step handles it fine), but because these
      # three env vars were simply never set here. Reproduced by reading
      # env.js's schema directly against this job's original (empty) env
      # block. Fixed with harmless placeholder values that satisfy Zod's
      # validation but are never actually connected to or used as real
      # secrets.
      NODE_ENV: test
      DATABASE_URL: postgres://unused:unused@localhost:5432/unused_unit_tests_never_connected
      JWT_ACCESS_SECRET: unit-tests-placeholder-access-secret-not-real-32chars
      JWT_REFRESH_SECRET: unit-tests-placeholder-refresh-secret-not-real-32chars
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          # SESSION 26 (§41 prompt maître) : un vrai package-lock.json
          # existe désormais (généré via .github/workflows/generate-lockfiles.yml,
          # qui a réellement tourné sur les serveurs GitHub avec accès
          # réseau — voir ce fichier). `cache: 'npm'` peut être réactivé
          # puisqu'il a maintenant un fichier réel pour calculer sa clé de
          # cache.

      - name: Install dependencies
        # SESSION 26 (§41 prompt maître) : basculé sur `npm ci` maintenant
        # qu'un vrai package-lock.json existe (voir commentaire ci-dessus)
        # — installation reproductible à l'octet près, plus rapide qu'un
        # `npm install` grâce au cache réactivé également ci-dessus.
        run: npm ci

      - name: Syntax check every source, script, and test file
        run: |
          find src scripts backend/tests tests -name '*.js' -print0 \
            | xargs -0 -I{} node --check {}

      - name: Dependency vulnerability scan
        # V41 noted this could not be run in the sandbox that built V35-V43
        # (no network access there). CI has network access, so this is
        # where it actually runs. `--audit-level=high` fails the build on
        # high/critical findings without blocking on low-severity noise.
        run: npm audit --audit-level=high

      # V44 finding: `npm run test:all` used to be `node --test
      # tests/**/*.test.js`. npm runs package.json scripts via `/bin/sh`
      # on Linux, which on GitHub's Ubuntu runners (like this one) is
      # dash — dash does not expand `**` as a recursive glob, so that
      # script silently ran a single test file out of the accumulated
      # suite (34 files, ~140 assertions as of V44) and reported
      # success or failure based on that alone. Reproduced and fixed in
      # this same version: scripts/collect-unit-tests.js walks tests/
      # itself (no shell glob involved) and passes an explicit file list
      # to node --test. This step is the reason that fix exists.
      - name: Run full unit/static test suite (all tests/*.test.js, recursively)
        run: npm run test:all

      - name: Run V32/V33/V34 real-source static audits
        run: |
          npm run audit:state-transitions
          npm run audit:forbidden-transitions
          npm run audit:inventory-concurrency

  postgres-suite:
    name: Real PostgreSQL suite (migrations, concurrency, reconciliation, restore drill)
    runs-on: ubuntu-latest
    needs: unit-tests
    defaults:
      run:
        working-directory: backend/livi
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: livi_test
          POSTGRES_USER: livi
          POSTGRES_PASSWORD: livi_test_only
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U livi -d livi_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      NODE_ENV: test
      DATABASE_URL: postgres://livi:livi_test_only@localhost:5433/livi_test
      PGHOST: localhost
      PGPORT: 5433
      PGUSER: livi
      PGPASSWORD: livi_test_only
      PGDATABASE: livi_test
      # Required by every real-Postgres script in this repo — see
      # scripts/v35_stock_restitution_concurrency.js,
      # scripts/v31_1_real_withdrawal_concurrency.js, etc. This is CI,
      # never production, so this explicit opt-in is intentional and safe.
      ALLOW_LIVI_CONCURRENCY_TEST: 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          # SESSION 26 (§41 prompt maître) : voir le commentaire identique
          # dans le job unit-tests ci-dessus — un vrai lockfile existe
          # désormais.

      - name: Install dependencies
        # SESSION 26 (§41 prompt maître) : voir le commentaire identique
        # dans le job unit-tests ci-dessus.
        run: npm ci

      # scripts/run-postgres-suite.js already runs migrate + db-smoke +
      # the V38 scenario + the V39 global concurrency suite + the V36/V37
      # reconciliation scripts + the V40 correction workflow + the V43
      # restore drill, in order, against this same database — see that
      # file for the authoritative list. This single step is therefore
      # "the" real-PostgreSQL suite for this project; nothing here
      # duplicates its logic.
      - name: Run full real-PostgreSQL suite
        run: npm run test:postgres

      - name: Restore-drill sanity check (rehearsed without a real backup)
        # Belt-and-suspenders: run the V43 restore-verification drill a
        # second time, standalone, exactly the way an operator would after
        # an actual restore — proves the command in
        # docs/V43_BACKUP_RESTORE_DR.md is correct and current, not just
        # correct as a step embedded inside run-postgres-suite.js.
        run: npm run restore:drill
